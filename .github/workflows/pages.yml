name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The canonical database is private. The site re-validates every public
      # record client-side, so compare against the schemas from the filtered
      # public snapshot rather than cloning the canonical repository.
      - name: Download the published schemas
        env:
          PUBLIC_DATA_ORIGIN: https://palomar-data.palomar-server.workers.dev
        run: |
          mkdir palomar-database
          curl --fail --silent --show-error --retry 3 \
            "$PUBLIC_DATA_ORIGIN/schema-v1.json" \
            --output palomar-database/schema-v1.json
          curl --fail --silent --show-error --retry 3 \
            "$PUBLIC_DATA_ORIGIN/schema-v2.json" \
            --output palomar-database/schema-v2.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.4.1"
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          PALOMAR_DATABASE_CHECKOUT: ${{ github.workspace }}/palomar-database
      - name: Resolve previous deployment revision
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "PALOMAR_PREVIOUS_REF=$BEFORE" >> "$GITHUB_ENV"
          fi
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          PALOMAR_PREVIOUS_REF: ${{ env.PALOMAR_PREVIOUS_REF }}
      - run: npm run build -- --version "${GITHUB_SHA}" --output .site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .site

  deploy:
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
