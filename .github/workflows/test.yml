name: Test presentation

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The canonical database is private. The site re-validates every public
      # record client-side, so compare against the schemas from the filtered
      # public snapshot rather than cloning the canonical repository.
      - name: Download the published schemas
        env:
          PUBLIC_DATA_ORIGIN: https://data.palomar-registry.org
        run: |
          mkdir palomar-database
          curl --fail --silent --show-error --retry 3 \
            "$PUBLIC_DATA_ORIGIN/schema-v1.json" \
            --output palomar-database/schema-v1.json
          curl --fail --silent --show-error --retry 3 \
            "$PUBLIC_DATA_ORIGIN/schema-v2.json" \
            --output palomar-database/schema-v2.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.4.1"
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          PALOMAR_DATABASE_CHECKOUT: ${{ github.workspace }}/palomar-database
      # Against the live service, because the grammar of what it serves lives
      # in the canonical database and this repository cannot see it. A link to
      # a document the service has removed answers 404 to a reader, which is
      # how seven links to `index.json` survived its removal.
      - name: Does the registry still serve every document the site links to
        run: node scripts/check-published.mjs --links
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          PALOMAR_PREVIOUS_REF: ${{ github.event.pull_request.base.sha }}
