name: Test presentation

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The canonical database is private. Exercise the contracts through the
      # filtered public snapshot: its schemas and the producer-owned recent
      # projection that the landing page consumes directly.
      - name: Download the published Database contracts
        env:
          PUBLIC_DATA_ORIGIN: https://data.palomar-registry.org
        run: |
          mkdir -p palomar-database/tests/fixtures
          curl --fail --silent --show-error --retry 3 \
            "$PUBLIC_DATA_ORIGIN/schema-v3.json" \
            --output palomar-database/schema-v3.json
          if ! curl --fail --silent --show-error --retry 3 \
              "$PUBLIC_DATA_ORIGIN/schema-v4.json" \
              --output palomar-database/schema-v4.json; then
            # Database publication is serialized and can lag its already
            # merged contract by one long snapshot upload. PR compatibility
            # still checks that reviewed producer source; Pages remains strict
            # against the deployed public URL.
            curl --fail --silent --show-error --retry 3 \
              https://raw.githubusercontent.com/PalomarRegistry/PalomarDatabase/main/schema-v4.json \
              --output palomar-database/schema-v4.json
          fi
          curl --fail --silent --show-error --retry 3 \
            "$PUBLIC_DATA_ORIGIN/recent.json" \
            --output palomar-database/tests/fixtures/recent.json
          curl --fail --silent --show-error --retry 3 \
            "$PUBLIC_DATA_ORIGIN/source-availability.json" \
            --output palomar-database/tests/fixtures/source-availability.json
          curl --fail --silent --show-error --retry 3 \
            "$PUBLIC_DATA_ORIGIN/browse/index.json" \
            --output tests/fixtures/public-browse/index.json
          browse_year=$(jq -er '.years[-1].year' tests/fixtures/public-browse/index.json)
          curl --fail --silent --show-error --retry 3 \
            "$PUBLIC_DATA_ORIGIN/browse/$browse_year.json" \
            --output tests/fixtures/public-browse/year.json
          browse_day=$(jq -er '.days[-1].day' tests/fixtures/public-browse/year.json)
          browse_page=$(jq -er '.days[-1].first_page' tests/fixtures/public-browse/year.json)
          curl --fail --silent --show-error --retry 3 \
            "$PUBLIC_DATA_ORIGIN/browse/$browse_day/$browse_page.json" \
            --output tests/fixtures/public-browse/page.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.4.1"
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          PALOMAR_DATABASE_CHECKOUT: ${{ github.workspace }}/palomar-database
      # This is intentionally broader than a page load: traverse browse and
      # every per-ID history, then validate every active public permalink.
      - name: Can Web read every currently published entry version
        run: node scripts/check-published.mjs --data "$PUBLIC_DATA_ORIGIN"
        env:
          PUBLIC_DATA_ORIGIN: https://data.palomar-registry.org
      # Against the live owners, because this repository cannot prove that a
      # registry document or the one Policy document selected for link health
      # still exists. A removed document answers 404 to a reader.
      - name: Do monitored linked documents still resolve
        run: node scripts/check-published.mjs --links
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          PALOMAR_PREVIOUS_REF: ${{ github.event.pull_request.base.sha }}
